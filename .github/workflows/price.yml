name: 장 마감 종가 반영

on:
  schedule:
    - cron: "45 6 * * 1-5"   # 평일 15:45 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_price.py
      - name: 바뀐 경우에만 커밋
        run: |
          if git diff --quiet -- price.json && git ls-files --error-unmatch price.json >/dev/null 2>&1; then
            echo "변경 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add price.json
          git commit -m "종가 갱신 $(jq -r .date price.json) $(jq -r .close price.json)"
          git push
